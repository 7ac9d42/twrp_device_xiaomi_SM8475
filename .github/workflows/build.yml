name: Build YARP for liuqin

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yarp-liuqin-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      JOBS: '4'
      SYNC_JOBS: '8'
      SOONG_GOMEMLIMIT: 6GiB
      USE_CCACHE: 'true'
      CCACHE_MAX_SIZE: 5Gi
      DEBIAN_FRONTEND: noninteractive
      GIT_TERMINAL_PROMPT: '0'
    steps:
      - name: Check out the device tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Initialize build paths and deadline
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/yarp-source" "$RUNNER_TEMP/yarp-download" "$RUNNER_TEMP/yarp-logs" "$RUNNER_TEMP/yarp-output" "$RUNNER_TEMP/yarp-source/out/ccache"
          {
            printf 'SOURCE_ROOT=%s/yarp-source\n' "$RUNNER_TEMP"
            printf 'CI_LOG_DIR=%s/yarp-logs\n' "$RUNNER_TEMP"
            printf 'CCACHE_DIR=%s/yarp-source/out/ccache\n' "$RUNNER_TEMP"
            printf 'CI_DEADLINE=%s\n' "$(( $(date +%s) + 330 * 60 ))"
          } >> "$GITHUB_ENV"

      - name: Prepare standard hosted runner
        shell: bash
        run: bash tools/ci/prepare-runner.sh

      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=15s 5m sudo -n apt-get update
          timeout --kill-after=15s 10m sudo -n apt-get install -y --no-install-recommends \
            bc bison build-essential ccache curl flex g++-multilib gcc-multilib git \
            gperf lib32z1-dev libelf-dev liblz4-dev libncurses-dev libssl-dev \
            libxml2-utils libzstd-dev lz4 lzop python-is-python3 python3 repo \
            rsync unzip xsltproc zip zlib1g-dev
          sudo -n apt-get clean

      - name: Verify and extract fixed vendor payloads
        shell: bash
        run: |
          set -euo pipefail
          image="$RUNNER_TEMP/yarp-download/recovery.img"
          curl --fail --location --retry 2 --connect-timeout 20 --max-time 300 \
            https://github.com/7ac9d42/twrp_device_xiaomi_SM8475/releases/download/v1.0.0/recovery.img \
            --output "$image"
          python3 -I tools/extract-files.py --root "$SOURCE_ROOT" --recovery "$image" \
            2>&1 | tee "$CI_LOG_DIR/vendor-extraction.log"
          python3 -I tools/extract-files.py --root "$SOURCE_ROOT" --check

      - name: Initialize the locked manifest
        working-directory: ${{ env.SOURCE_ROOT }}
        shell: bash
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/tools/ci/run-stage.sh" init \
            repo init \
            -u "https://github.com/$GITHUB_REPOSITORY.git" -b "$GITHUB_SHA" \
            -m integration/manifest.lock.xml --depth=1 --partial-clone \
            --clone-filter=blob:none --no-clone-bundle
          mkdir -p device/xiaomi/liuqin
          rsync -a --exclude=.git --exclude=.github "$GITHUB_WORKSPACE/" device/xiaomi/liuqin/

      - name: Synchronize minimal sources
        id: sync
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/run-stage.sh sync bash "$SOURCE_ROOT/device/xiaomi/liuqin/tools/sync.sh"
          cd "$SOURCE_ROOT"
          repo manifest -r -o "$RUNNER_TEMP/yarp-output/manifest.lock.xml"
          df -h . | tee "$CI_LOG_DIR/disk-after-sync.log"
          free -h | tee "$CI_LOG_DIR/memory-after-sync.log"
          du -sh .repo prebuilts external frameworks > "$CI_LOG_DIR/source-sizes.log"

      - name: Prepare compiler cache restore
        id: cache-config
        if: env.USE_CCACHE == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          clang_revision=$(python3 -I -c 'import xml.etree.ElementTree as E; print(E.parse("integration/manifest.lock.xml").find("./project[@path=\"prebuilts/clang/host/linux-x86\"]").attrib["revision"])')
          manifest_hash=$(sha256sum integration/manifest.lock.xml | cut -d ' ' -f1)
          config_hash=$(git ls-files -z -- '*.mk' '*.bp' '*.prop' '*.fstab' \
            'bootctrl/**' 'gpt-utils/**' 'recovery/**' 'prebuilt/**' 'kernel/**' \
            'patches/**' 'integration/**' 'proprietary-files.json' \
            'tools/build.sh' 'tools/apply-patches.py' 'tools/extract-files.py' \
            | sort -z | xargs -0 sha256sum | sha256sum | cut -d ' ' -f1)
          prefix="yarp-ccache-v1-$RUNNER_OS-$RUNNER_ARCH-$clang_revision-"
          {
            printf 'prefix=%s\n' "$prefix"
            printf 'key=%s%s-%s\n' "$prefix" "$manifest_hash" "$config_hash"
          } >> "$GITHUB_OUTPUT"
          df -h "$CCACHE_DIR" | tee "$CI_LOG_DIR/disk-before-cache-restore.log"
          available=$(df -Pk "$CCACHE_DIR" | awk 'NR==2 {print $4}')
          if (( available >= 30 * 1024 * 1024 )); then
            printf 'restore=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Skip cache restore: less than 30 GiB free for cache plus compilation.\n'
          fi
          now=$(date +%s)
          printf 'CACHE_RESTORE_START=%s\n' "$now" >> "$GITHUB_ENV"
          printf '{"stage":"cache-restore","start_epoch":%s,"end_epoch":%s,"status":"running"}\n' \
            "$now" "$now" > "$CI_LOG_DIR/cache-restore.json"

      - name: Restore compiler cache
        id: cache-restore
        if: env.USE_CCACHE == 'true' && steps.cache-config.outputs.restore == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/yarp-source/out/ccache
          key: ${{ steps.cache-config.outputs.key }}
          restore-keys: ${{ steps.cache-config.outputs.prefix }}

      - name: Record compiler cache restore
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CACHE_OUTCOME: ${{ steps.cache-restore.outcome }}
        run: |
          now=$(date +%s)
          printf '{"stage":"cache-restore","start_epoch":%s,"end_epoch":%s,"status":"%s"}\n' \
            "${CACHE_RESTORE_START:-$now}" "$now" "${CACHE_OUTCOME:-skipped}" > "$CI_LOG_DIR/cache-restore.json"
          df -h "$CCACHE_DIR" | tee "$CI_LOG_DIR/disk-after-cache-restore.log"

      - name: Build recovery and validation tools
        id: build
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/run-stage.sh build bash "$SOURCE_ROOT/device/xiaomi/liuqin/tools/build.sh"

      - name: Verify the final image
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          bash tools/ci/run-stage.sh verify bash "$SOURCE_ROOT/device/xiaomi/liuqin/tools/verify.sh"
          cp "$SOURCE_ROOT/out/target/product/liuqin/recovery.img" "$RUNNER_TEMP/yarp-output/recovery.img"
          cd "$RUNNER_TEMP/yarp-output"
          sha256sum recovery.img > SHA256SUMS
          printf 'device_tree=%s\nrepository=%s\n' "$GITHUB_SHA" "$GITHUB_REPOSITORY" > source.txt

      - name: Prepare compiler cache save
        id: cache-save-config
        if: always()
        continue-on-error: true
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          CACHE_HIT: ${{ steps.cache-restore.outputs.cache-hit }}
          CACHE_KEY: ${{ steps.cache-config.outputs.key }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          printf 'CACHE_SAVE_START=%s\n' "$now" >> "$GITHUB_ENV"
          printf '{"stage":"cache-save","start_epoch":%s,"end_epoch":%s,"status":"running"}\n' \
            "$now" "$now" > "$CI_LOG_DIR/cache-save.json"
          if [[ "$USE_CCACHE" != true || "$BUILD_OUTCOME" != success || "$VERIFY_OUTCOME" != success || "$CACHE_HIT" == true || -z "$CACHE_KEY" ]]; then
            printf 'Skip cache save: requires a successful verified build and a new cache key.\n'
            exit 0
          fi
          df -h "$CCACHE_DIR" | tee "$CI_LOG_DIR/disk-before-cache-save.log"
          available=$(df -Pk "$CCACHE_DIR" | awk 'NR==2 {print $4}')
          # Reserve 3 GiB free plus 5 GiB for the archive; keep existing data.
          if (( available >= 8 * 1024 * 1024 )); then
            printf 'save=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'Skip cache save: less than 8 GiB free for archive and reserve.\n'
          fi

      - name: Save compiler cache
        id: cache-save
        if: always() && steps.cache-save-config.outputs.save == 'true'
        continue-on-error: true
        timeout-minutes: 10
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ runner.temp }}/yarp-source/out/ccache
          key: ${{ steps.cache-config.outputs.key }}

      - name: Record compiler cache save
        if: always()
        continue-on-error: true
        shell: bash
        env:
          CACHE_OUTCOME: ${{ steps.cache-save.outcome }}
        run: |
          now=$(date +%s)
          printf '{"stage":"cache-save","start_epoch":%s,"end_epoch":%s,"status":"%s"}\n' \
            "${CACHE_SAVE_START:-$now}" "$now" "${CACHE_OUTCOME:-skipped}" > "$CI_LOG_DIR/cache-save.json"

      - name: Collect diagnostics
        if: always()
        shell: bash
        env:
          SYNC_OUTCOME: ${{ steps.sync.outcome }}
        run: |
          mkdir -p "$RUNNER_TEMP/yarp-logs"
          df -h > "$RUNNER_TEMP/yarp-logs/disk-final.log"
          free -h > "$RUNNER_TEMP/yarp-logs/memory-final.log"
          if [[ "$SYNC_OUTCOME" == success && -d "$SOURCE_ROOT/.repo" ]]; then
            (cd "$SOURCE_ROOT" && timeout --kill-after=5s 60s repo diff) > "$RUNNER_TEMP/yarp-logs/source-patches.diff" 2>&1 || true
          fi
          python3 -I tools/ci/summarize.py --logs "$CI_LOG_DIR" --source "$SOURCE_ROOT" --summary "$GITHUB_STEP_SUMMARY"

      - name: Upload verified recovery
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yarp-liuqin-${{ github.run_number }}
          path: ${{ runner.temp }}/yarp-output/
          if-no-files-found: error
          retention-days: 14
          compression-level: 1

      - name: Upload logs and image checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: yarp-liuqin-diagnostics-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/yarp-logs/
            ${{ runner.temp }}/yarp-source/logs/
            ${{ runner.temp }}/yarp-source/artifacts/*.json
            ${{ runner.temp }}/yarp-source/artifacts/*.xml
            ${{ runner.temp }}/yarp-source/artifacts/image-check/report.json
            ${{ runner.temp }}/yarp-source/out/.ninja_log
            ${{ runner.temp }}/yarp-source/out/soong/.ninja_log
            ${{ runner.temp }}/yarp-source/out/soong/soong.log
            ${{ runner.temp }}/yarp-source/out/soong/soong_build_metrics.pb
            ${{ runner.temp }}/yarp-source/out/soong/build.ninja.d
            ${{ runner.temp }}/yarp-source/out/soong.log
            ${{ runner.temp }}/yarp-source/out/soong_build_metrics.pb
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          compression-level: 1
